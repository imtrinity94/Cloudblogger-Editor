<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Engine diagnostics</title>
    <style>
        body { background: #0f171c; color: #49afd9; font: 14px Consolas, monospace; padding: 20px; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h3>Cloudblogger Editor: engine diagnostics</h3>
    <pre id="log"></pre>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <script src="engine/request.js"></script>
    <script>
        var t0 = performance.now();
        function log(m) {
            document.getElementById("log").textContent += Math.round(performance.now() - t0) + "ms  " + m + "\n";
        }
        (async function () {
            try {
                log("cheerpjInit…");
                await cheerpjInit({ status: "default" });
                log("runLibrary…");
                var dir = JSON.parse(await (await fetch("engine/engines.json", { cache: "no-cache" })).text()).dir;
                log("engine dir: " + dir);
                var lib = await cheerpjRunLibrary("/app/" + dir + "/launcher.jar");
                var L = await lib.vroconsole.Launcher;
                await L.setBaseDir("/app/" + dir);
                log("ping: " + await L.ping());
                var q = new URLSearchParams(location.search);
                var engine = q.get("engine") || "9x";
                log("diag " + engine + ":\n" + await L.diag(engine));
                var get = function (u) { return fetch(u, { cache: "no-cache" }).then(function (r) { return r.text(); }); };
                var mocks = await get("engine/vro-mocks.js");
                var fixture = JSON.parse(await get("engine/fixture.default.json"));
                var profiles = JSON.parse(await get("engine/profiles.json"));
                var useMocks = q.get("mocks") !== "0";
                var code = q.get("code") || "System.log('hi'); return VcPlugin.getAllVirtualMachines().length;";
                for (var i = 1; i <= 2; i++) {
                    var req = VroRequest.buildRequest({ code: code, mocks: useMocks ? mocks : "", fixture: useMocks ? fixture : {},
                        profile: profiles[engine], trace: true, timeoutMs: 60000 });
                    log("run " + i + " (" + req.length + " chars, mocks=" + useMocks + ")…");
                    var t = performance.now();
                    var out = await L.run(engine, req);
                    log("run " + i + " took " + Math.round(performance.now() - t) + "ms: " + String(out).slice(0, 300));
                }
            } catch (e) {
                log("ERROR: " + e + (e && e.stack ? "\n" + e.stack : ""));
            }
        })();
    </script>
</body>
</html>
